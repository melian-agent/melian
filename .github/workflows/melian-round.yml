name: melian round

# A builder starts a full Melian round on a writer's pull request and reads the findings back on it. Melian is built
# from the default branch and reviews the pull request as data, so the head's code runs only where Melian runs it for
# a writer's head, in its static checks; a fork's head never runs with secrets. The round's store is thrown
# away: it never publishes or dismisses, since a fresh store mints a new marker secret and would orphan the pull
# request's ledger.

on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request number
        required: true
        type: number

permissions:
  contents: read

concurrency:
  group: melian-round-${{ inputs.pull_request }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      head: ${{ steps.pull.outputs.head }}
      base: ${{ steps.pull.outputs.base }}
    steps:
      # Every script and the Melian build that hold a secret come from the workflow's own commit, so only the default
      # branch may supply them. A pull request's base can be another writer's unmerged branch, and `--ref` can name any.
      - name: Refuse a dispatch from any branch but the default
        env:
          REF: ${{ github.ref }}
          DEFAULT: ${{ github.event.repository.default_branch }}
        run: |
          if [ -z "$DEFAULT" ] || [ "$REF" != "refs/heads/$DEFAULT" ]; then
            echo "::error::a round runs only from the default branch's workflow, not $REF"
            exit 1
          fi
      - name: Refuse a starter without write permission
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          STARTER: ${{ github.triggering_actor }}
        run: |
          permission=$(gh api "repos/$REPOSITORY/collaborators/$STARTER/permission" --jq .permission)
          case "$permission" in
            admin|maintain|write) echo "$STARTER has $permission permission" ;;
            *) echo "::error::$STARTER has ${permission:-unknown} permission; a round needs write, maintain or admin"; exit 1 ;;
          esac
      - name: Refuse a fork's head
        id: pull
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          NUMBER: ${{ inputs.pull_request }}
        run: |
          gh api "repos/$REPOSITORY/pulls/$NUMBER" > "$RUNNER_TEMP/pull.json"
          state=$(jq -r .state "$RUNNER_TEMP/pull.json")
          head_repository=$(jq -r '.head.repo.full_name // ""' "$RUNNER_TEMP/pull.json")
          head=$(jq -r .head.sha "$RUNNER_TEMP/pull.json")
          base=$(jq -r .base.sha "$RUNNER_TEMP/pull.json")
          if [ "$state" != open ]; then echo "::error::pull request $NUMBER is $state"; exit 1; fi
          if [ "$head_repository" != "$REPOSITORY" ]; then
            echo "::error::pull request $NUMBER's head is in ${head_repository:-a deleted repository}, not $REPOSITORY; a fork's head never runs with secrets"
            exit 1
          fi
          if ! [[ "$head" =~ ^[0-9a-f]{40}$ && "$base" =~ ^[0-9a-f]{40}$ ]]; then echo "::error::unreadable head or base SHA"; exit 1; fi
          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # The writer decision trusts a head only when the identity that pushed that exact commit holds write permission,
      # so a writer dispatching a round on a bot's branch is not enough. Every page of push events is read; a failed
      # read fails this step, and no later job holds a secret.
      - name: Refuse a head its pusher could not have written
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD: ${{ steps.pull.outputs.head }}
        run: |
          branch=$(jq -r .head.ref "$RUNNER_TEMP/pull.json")
          author=$(jq -r '.user.login // ""' "$RUNNER_TEMP/pull.json")
          gh api --paginate "repos/$REPOSITORY/events?per_page=100" \
            --jq '.[] | select(.type == "PushEvent") | {actor: .actor.login, head: .payload.head, ref: .payload.ref} | tojson' \
            > "$RUNNER_TEMP/pushes.jsonl"
          writer=$(node scripts/round-writer.mjs "$RUNNER_TEMP/pushes.jsonl" "$HEAD" "$branch" "$author")
          permission=$(gh api "repos/$REPOSITORY/collaborators/$writer/permission" --jq .permission) || permission=""
          case "$permission" in
            admin|maintain|write) echo "$writer, whose code the head is, has $permission permission" ;;
            *) echo "::error::$writer, whose code the head is, has ${permission:-no known} permission; a round runs only a writer's head"; exit 1 ;;
          esac

  round:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
      pull-requests: read
    outputs:
      artifact: ${{ steps.artifact.outputs.name }}
    steps:
      # A rerun of failed jobs alone bumps run_attempt for report but keeps this job's earlier attempt, so report reads
      # the name from this output, never from its own run_attempt.
      - id: artifact
        run: echo "name=melian-round-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
      # The default branch's commit, which the gate required, supplies Melian and every helper script, so neither the
      # pull request's head nor its base decides what runs with the logins; both stay review data. The whole history,
      # so Melian can fetch the pull request and find its merge base; the credentials let it fetch refs/pull/N/head.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: melian
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
        working-directory: melian
      # The logins reach only this step. Melian reads CLAUDE_CODE_OAUTH_TOKEN itself. The Codex login's access token
      # goes to Melian as a named bearer credential, by variable, so no file holds it, and Pi's store stays empty, so
      # nothing refreshes the login and rotates its refresh token. An expired token reads as absent, and the plan derives
      # a Claude route, which the comment lists as a check that left the committed routes. The comment reads only the
      # verdict JSON; the text output is for the summary and the artefact.
      - name: Run the round
        working-directory: melian
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CODEX_AUTH_B64: ${{ secrets.CODEX_AUTH_B64 }}
          GITHUB_TOKEN: ${{ github.token }}
          NUMBER: ${{ inputs.pull_request }}
          BASE: ${{ needs.gate.outputs.base }}
          HEAD: ${{ needs.gate.outputs.head }}
        run: |
          out="$RUNNER_TEMP/round"
          mkdir -p "$out" "$RUNNER_TEMP/state" "$RUNNER_TEMP/config/melian" "$RUNNER_TEMP/pi"
          export MELIAN_STATE_DIR="$RUNNER_TEMP/state" XDG_CONFIG_HOME="$RUNNER_TEMP/config" PI_CODING_AGENT_DIR="$RUNNER_TEMP/pi"
          if token=$(node scripts/round-codex-token.mjs); then
            echo "::add-mask::$token"
            export MELIAN_CODEX_ACCESS_TOKEN="$token"
            printf 'credentials:\n  actions-codex: { provider: openai-codex, env: MELIAN_CODEX_ACCESS_TOKEN }\n' > "$XDG_CONFIG_HOME/melian/secrets.yaml"
          fi
          unset token CODEX_AUTH_B64
          node packages/cli/bin/melian.js doctor > "$out/doctor.txt" 2>&1 || true
          set +e
          node packages/cli/bin/melian.js review "#$NUMBER" --json --no-walkthrough > "$out/verdict.json" 2> "$out/round.err"
          echo $? > "$out/exit"
          node packages/cli/bin/melian.js findings "#$NUMBER" --no-color > "$out/round.txt" 2>> "$out/round.err"
          # "#N" reads the pull request again, so the comment checks that the round reviewed what the gate approved:
          # the round's own base and head against the gate's head and their merge base.
          node packages/cli/bin/melian.js findings "#$NUMBER" --rounds --json > "$out/rounds.json" 2>> "$out/round.err"
          git merge-base "$BASE" "$HEAD" > "$out/merge-base" 2>> "$out/round.err"
          exit 0
      - name: Write the job summary
        if: always()
        run: |
          out="$RUNNER_TEMP/round"
          {
            echo "## Melian round, exit $(cat "$out/exit" 2>/dev/null || echo none)"
            node melian/scripts/round-comment.mjs --fence "$out/round.txt"
            echo "### Standard error"
            node melian/scripts/round-comment.mjs --fence "$out/round.err"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ runner.temp }}/round
          if-no-files-found: ignore
          retention-days: 30

  report:
    needs: [gate, round]
    if: always() && needs.gate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # A round that finished uploaded its artefact, so a missing one fails this job rather than post a comment that
      # says the round ended before a verdict. An empty name would download every artefact of the run.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.round.outputs.artifact != ''
        continue-on-error: ${{ needs.round.result != 'success' }}
        with:
          name: ${{ needs.round.outputs.artifact }}
          path: ${{ runner.temp }}/round
      - name: Comment on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          NUMBER: ${{ inputs.pull_request }}
          BASE: ${{ needs.gate.outputs.base }}
          HEAD: ${{ needs.gate.outputs.head }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
        run: |
          out="$RUNNER_TEMP/round"
          # Read again just before posting: a push or a retarget during the round leaves findings for a revision the
          # pull request no longer shows. A failed read leaves both empty, and the comment posts no findings.
          current=$(gh api "repos/$REPOSITORY/pulls/$NUMBER" --jq '.base.sha + " " + .head.sha') || current=""
          read -r current_base current_head <<< "$current" || true
          node scripts/round-comment.mjs --verdict "$out/verdict.json" --rounds "$out/rounds.json" \
            --exit "$(cat "$out/exit" 2>/dev/null || echo none)" --run-url "$RUN_URL" --run-id "$RUN_ID" --base "$BASE" --head "$HEAD" \
            --merge-base "$(cat "$out/merge-base" 2>/dev/null || echo none)" \
            ${current_head:+--current-base "$current_base" --current-head "$current_head"} > "$RUNNER_TEMP/comment.md"
          # A rerun of this job finds the comment this run already posted, by its marker and this job's identity, and
          # updates it, so a post GitHub accepted before the job failed is never repeated.
          gh api --paginate "repos/$REPOSITORY/issues/$NUMBER/comments?per_page=100" \
            --jq '.[] | {id, login: .user.login, body} | tojson' > "$RUNNER_TEMP/comments.jsonl"
          own=$(node scripts/round-own-comment.mjs "$RUNNER_TEMP/comments.jsonl" "$RUN_ID" "github-actions[bot]")
          if [ -n "$own" ]; then
            gh api -X PATCH "repos/$REPOSITORY/issues/comments/$own" -F "body=@$RUNNER_TEMP/comment.md" > /dev/null
          else
            gh pr comment "$NUMBER" --repo "$REPOSITORY" --body-file "$RUNNER_TEMP/comment.md"
          fi
