name: ci-experiment

# A measurement for issue #558, on a draft pull request that never merges: how the check's steps scale with runner size,
# Vitest's worker count and sharding. Node 24 only, the slowest of the three required jobs.
on:
  pull_request:

permissions:
  contents: read

jobs:
  measure:
    name: ${{ matrix.arm.name }} run ${{ matrix.attempt }}
    runs-on: ${{ matrix.arm.runner }}
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2, 3]
        arm:
          - { name: a 4v default, runner: blacksmith-4vcpu-ubuntu-2404, vitest: "" }
          - { name: b 8v default, runner: blacksmith-8vcpu-ubuntu-2404, vitest: "" }
          - { name: c 8v workers 8, runner: blacksmith-8vcpu-ubuntu-2404, vitest: "--maxWorkers=8" }
          - { name: d 16v default, runner: blacksmith-16vcpu-ubuntu-2404, vitest: "" }
          - { name: e 16v workers 16, runner: blacksmith-16vcpu-ubuntu-2404, vitest: "--maxWorkers=16" }
          - { name: f 4v shard 1 of 2, runner: blacksmith-4vcpu-ubuntu-2404, vitest: "--shard=1/2" }
          - { name: f 4v shard 2 of 2, runner: blacksmith-4vcpu-ubuntu-2404, vitest: "--shard=2/2" }
          - { name: g 4v shard 1 of 4, runner: blacksmith-4vcpu-ubuntu-2404, vitest: "--shard=1/4" }
          - { name: g 4v shard 2 of 4, runner: blacksmith-4vcpu-ubuntu-2404, vitest: "--shard=2/4" }
          - { name: g 4v shard 3 of 4, runner: blacksmith-4vcpu-ubuntu-2404, vitest: "--shard=3/4" }
          - { name: g 4v shard 4 of 4, runner: blacksmith-4vcpu-ubuntu-2404, vitest: "--shard=4/4" }
          - { name: h 8v shard 1 of 2, runner: blacksmith-8vcpu-ubuntu-2404, vitest: "--shard=1/2" }
          - { name: h 8v shard 2 of 2, runner: blacksmith-8vcpu-ubuntu-2404, vitest: "--shard=2/2" }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - name: Let probes run under bubblewrap
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap socat ripgrep
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - run: npm ci --ignore-scripts
      - run: git fetch --no-tags origin +main:refs/remotes/origin/main
      - name: Machine
        run: nproc && free -m && node -p 'require("node:os").availableParallelism()'
      - name: biome
        run: npx biome check --error-on-warnings .
      - name: pinned deps
        run: node scripts/check-pinned-deps.mjs
      - name: release age
        run: node scripts/check-release-age.mjs
      - name: tools
        run: node scripts/check-tools.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: tsc
        run: npx tsc --noEmit
      - name: audit
        continue-on-error: true
        run: npm audit --audit-level=high
      - name: vitest
        continue-on-error: true
        run: npx vitest --run ${{ matrix.arm.vitest }} --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/vitest.json"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MELIAN_PROBE_SANDBOX: "1"
      - name: Load
        if: ${{ !cancelled() }}
        run: |
          echo "nproc $(nproc); load $(cat /proc/loadavg)"
          jq -r '[.testResults[].assertionResults[] | select((.duration // 0) > 4000)] | "tests over 4 s: \(length)"' "$RUNNER_TEMP/vitest.json"
          jq -r '"tests: \(.numTotalTests) passed \(.numPassedTests) failed \(.numFailedTests) pending \(.numPendingTests)"' "$RUNNER_TEMP/vitest.json"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vitest-${{ strategy.job-index }}
          path: ${{ runner.temp }}/vitest.json
          retention-days: 7
