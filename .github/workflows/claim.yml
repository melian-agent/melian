name: claim

# Cloud builders reach GitHub through an app that cannot edit labels, so this swaps the claim labels for them under the
# rules in AGENTS.md's Work from issues. The comment is only ever data: the script reads it from the event payload,
# and nothing interpolates it into a shell or a script.
on:
  issue_comment:
    types: [created]

permissions:
  issues: write

concurrency:
  group: claim-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  swap-labels:
    if: ${{ !github.event.issue.pull_request && (startsWith(github.event.comment.body, 'Claim:') || startsWith(github.event.comment.body, 'Released:')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const READY = "status: ready";
            const IN_PROGRESS = "status: in progress";
            const { owner, repo } = context.repo;
            const { comment, issue } = context.payload;
            const issue_number = issue.number;
            if (issue.pull_request) return;
            const isClaim = (body) => body.startsWith("Claim:");
            const command = isClaim(comment.body) ? "claim" : comment.body.startsWith("Released:") ? "release" : undefined;
            if (!command) return;

            const writers = new Map();
            const isWriter = async (login) => {
              if (!writers.has(login)) {
                try {
                  const { data } = await github.rest.repos.getCollaboratorPermissionLevel({ owner, repo, username: login });
                  writers.set(login, data.permission === "admin" || data.permission === "write");
                } catch (error) {
                  if (error.status !== 404) throw error;
                  writers.set(login, false);
                }
              }
              return writers.get(login);
            };
            const swap = async (from, to) => {
              await github.rest.issues.removeLabel({ owner, repo, issue_number, name: from });
              await github.rest.issues.addLabels({ owner, repo, issue_number, labels: [to] });
              core.info(`Swapped "${from}" for "${to}".`);
            };

            if (!(await isWriter(comment.user.login))) return core.info(`${comment.user.login} is not a writer.`);
            const { data: current } = await github.rest.issues.get({ owner, repo, issue_number });
            const labels = current.labels.map((label) => label.name);

            if (command === "release") {
              if (!labels.includes(IN_PROGRESS)) return core.info(`The issue is not "${IN_PROGRESS}".`);
              return swap(IN_PROGRESS, READY);
            }

            if (!labels.includes(READY)) return core.info(`The issue is not "${READY}".`);
            const events = await github.paginate(github.rest.issues.listEvents, { owner, repo, issue_number, per_page: 100 });
            const readied = events.filter((event) => event.event === "labeled" && event.label.name === READY).at(-1);
            if (!readied) return core.info(`No event labelled the issue "${READY}".`);
            const since = Date.parse(readied.created_at);
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              since: readied.created_at,
              per_page: 100,
            });
            let earliest;
            for (const candidate of comments.toSorted((a, b) => a.id - b.id)) {
              if (Date.parse(candidate.created_at) < since || !isClaim(candidate.body)) continue;
              if (await isWriter(candidate.user.login)) {
                earliest = candidate;
                break;
              }
            }
            if (earliest?.id !== comment.id) return core.info(`An earlier claim stands: ${earliest?.html_url}`);
            await swap(READY, IN_PROGRESS);
