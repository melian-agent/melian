name: check

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.node }})
    # Four minutes against twelve on 4 vCPU, for about $0.10 more a run; docs/decisions/2026-11-18-check-runs-on-16-vcpu.md says why.
    runs-on: blacksmith-16vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      # The whole history: the triage test checks questions.json against every earlier committed record, and fails
      # closed on a shallow clone.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # Node 22 bundles npm 10, which silently ignores min-release-age in .npmrc.
      - if: matrix.node == 22
        run: npm install -g npm@11.19.0
      # Probes run under sandbox-runtime, which needs bubblewrap, socat and ripgrep on Linux, and user namespaces that
      # Ubuntu 24.04's AppArmor can restrict. MELIAN_PROBE_SANDBOX=1 below makes the probe suites fail, not skip, if any
      # of it is missing.
      - name: Let probes run under bubblewrap
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap socat ripgrep
          # Runner images differ: an image without the restriction has no such setting.
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - run: npm ci --ignore-scripts
      # The round job runs probes on this image under Node 24, so the image proves the sandbox holds here first.
      - if: matrix.node == 24
        name: Prove a probe cannot reach the runner's secrets
        # The commit checked out, so CI proves the change's own probe.read.
        env:
          MELIAN_PROBE_POLICY_COMMIT: ${{ github.sha }}
        run: node --conditions=@melian-agent/source scripts/round-probe-containment.mjs
      # The triage gate compares questions.json with main's, at origin/main. A push run already has origin/main at the
      # pushed commit, so the gate has nothing to compare; fetching would be refused as a non-fast-forward once main
      # moved on, and would compare the commit with a later one. No --depth: it would make the clone shallow again.
      - if: github.event_name != 'push'
        run: git fetch --no-tags origin +main:refs/remotes/origin/main
      - run: npm run check -- --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/vitest.json"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MELIAN_PROBE_SANDBOX: "1"
      # check (macos, 24) compares this report with the macOS job's.
      - if: matrix.node == 24 && !cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-vitest-report
          path: ${{ runner.temp }}/vitest.json
          retention-days: 1
      # The publish check. The tests run the CLI from source, so nothing else builds dist/, packs it, or runs the
      # shim's tarball branch. `! grep` would not fail a step under bash -e, hence the if.
      - name: Pack, install, and run the published CLI
        run: |
          npm run pack -- "$RUNNER_TEMP/tarballs"
          listing=$(tar tzf "$RUNNER_TEMP"/tarballs/melian-agent-cli-*.tgz)
          grep -qx package/bin/melian.js <<<"$listing"
          grep -qx package/dist/bin.js <<<"$listing"
          if grep -q '^package/src/' <<<"$listing"; then echo "the cli tarball ships src/"; exit 1; fi
          mkdir "$RUNNER_TEMP/project"
          cp .npmrc "$RUNNER_TEMP/project/"
          cd "$RUNNER_TEMP/project"
          npm init -y > /dev/null
          # Every tarball the pack made, not a list: a list misses a workspace package the CLI comes to depend on, and npm
          # then asks the registry for it.
          npm install --ignore-scripts "$RUNNER_TEMP"/tarballs/*.tgz
          # An empty stderr proves src/warnings.ts still drops Node 22's SQLite warning in the built output.
          node_modules/.bin/melian --help > "$RUNNER_TEMP/help.out" 2> "$RUNNER_TEMP/help.err"
          grep -q '^Usage: melian ' "$RUNNER_TEMP/help.out"
          if [ -s "$RUNNER_TEMP/help.err" ]; then cat "$RUNNER_TEMP/help.err"; echo "melian --help wrote to stderr"; exit 1; fi
          git init -q
          mkdir "$RUNNER_TEMP/config" "$RUNNER_TEMP/pi"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/config" PI_CODING_AGENT_DIR="$RUNNER_TEMP/pi"
          node_modules/.bin/melian tools > "$RUNNER_TEMP/tools.out"
          grep -q '^enola@.*not yet fetched' "$RUNNER_TEMP/tools.out"
          node_modules/.bin/melian doctor > "$RUNNER_TEMP/doctor.out"
          grep -q 'tool enola.*not yet fetched' "$RUNNER_TEMP/doctor.out"
          # The recorded code hashes are read from the built package, which ships no source to hash.
          node --input-type=module -e "import { codeVersion } from '@melian-agent/pipeline'; if (!/^[0-9a-f]{64}\$/.test(codeVersion('adjudication'))) { console.error('codeVersion failed in the tarball'); process.exit(1); }"
      - name: Fail if check rewrote files
        run: git diff --exit-code

  # Linux skips the tests that need sandbox-exec, a BSD ps or launchd. This job runs, beside the Linux jobs, the files
  # scripts/macos-tests.json lists: the probe suites, which run under seatbelt here and bubblewrap there, the files that
  # hold a test Linux skips, and only the timing tests of the probing level, whose outcome depends on the platform's
  # clock, shell and signals. Biome, tsc, the audit and every other test ran on Linux already. A test that passes on
  # Linux and fails only on macOS is not run here unless its file is listed, which is why AGENTS.md keeps the host rerun
  # until check (macos, 24) is required.
  test-macos:
    name: test (macos, 24)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - if: github.event_name != 'push'
        run: git fetch --no-tags origin +main:refs/remotes/origin/main
      # The seatbelt suite skips its ssh-agent test unless launchd holds an agent socket.
      - name: Start an ssh agent for launchd
        run: |
          eval "$(ssh-agent -s)"
          launchctl setenv SSH_AUTH_SOCK "$SSH_AUTH_SOCK"
      - name: Run the listed files whole
        run: jq -r '(.suites + .skipped)[]' scripts/macos-tests.json | xargs npx vitest --run --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/macos/whole.json"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MELIAN_SANDBOX_NETWORK: "1"
          MELIAN_PROBE_SANDBOX: "1"
      - name: Run the tagged files' timing tests
        if: ${{ !cancelled() }}
        run: jq -r '.tagged[]' scripts/macos-tests.json | xargs npx vitest --run --tags-filter="$(jq -r .tag scripts/macos-tests.json)" --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/macos/tagged.json"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MELIAN_PROBE_SANDBOX: "1"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-vitest-reports
          path: ${{ runner.temp }}/macos
          retention-days: 1

  # The check that holds the promise: no test Linux skipped reaches main without passing on macOS. It keeps the name
  # branch protection will require, and fails on a list that misses a file Linux skipped a test in, naming the file.
  check-macos:
    name: check (macos, 24)
    needs: [check, test-macos]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-vitest-report
          path: ${{ runner.temp }}/linux
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-vitest-reports
          path: ${{ runner.temp }}/macos
      - name: Fail unless every test Linux skipped passed on macOS
        run: >-
          node scripts/compare-platform-reports.mjs --linux "$RUNNER_TEMP/linux/vitest.json"
          --mac "$RUNNER_TEMP/macos/whole.json" --mac "$RUNNER_TEMP/macos/tagged.json" --list scripts/macos-tests.json
