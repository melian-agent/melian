name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # Node 22 bundles npm 10, which silently ignores min-release-age in .npmrc.
      - if: matrix.node == 22
        run: npm install -g npm@11.19.0
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run build
      - name: Fail if check rewrote files
        run: git diff --exit-code
