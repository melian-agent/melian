name: check

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.node }})
    runs-on: blacksmith-4vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      # The whole history: the triage test checks questions.json against every earlier committed record, and fails
      # closed on a shallow clone.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # Node 22 bundles npm 10, which silently ignores min-release-age in .npmrc.
      - if: matrix.node == 22
        run: npm install -g npm@11.19.0
      - run: npm ci --ignore-scripts
      # The triage gate compares questions.json with main's, at origin/main. A push run already has origin/main at the
      # pushed commit, so the gate has nothing to compare; fetching would be refused as a non-fast-forward once main
      # moved on, and would compare the commit with a later one. No --depth: it would make the clone shallow again.
      - if: github.event_name != 'push'
        run: git fetch --no-tags origin +main:refs/remotes/origin/main
      - run: npm run check -- --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/vitest.json"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # The macOS job runs only the tests this report shows Linux skipped.
      - if: matrix.node == 24 && !cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-vitest-report
          path: ${{ runner.temp }}/vitest.json
          retention-days: 1
      # The publish check. The tests run the CLI from source, so nothing else builds dist/, packs it, or runs the
      # shim's tarball branch. `! grep` would not fail a step under bash -e, hence the if.
      - name: Pack, install, and run the published CLI
        run: |
          npm run pack -- "$RUNNER_TEMP/tarballs"
          listing=$(tar tzf "$RUNNER_TEMP"/tarballs/melian-agent-cli-*.tgz)
          grep -qx package/bin/melian.js <<<"$listing"
          grep -qx package/dist/bin.js <<<"$listing"
          if grep -q '^package/src/' <<<"$listing"; then echo "the cli tarball ships src/"; exit 1; fi
          mkdir "$RUNNER_TEMP/project"
          cp .npmrc "$RUNNER_TEMP/project/"
          cd "$RUNNER_TEMP/project"
          npm init -y > /dev/null
          # Every tarball the pack made, not a list: a list misses a workspace package the CLI comes to depend on, and npm
          # then asks the registry for it.
          npm install --ignore-scripts "$RUNNER_TEMP"/tarballs/*.tgz
          # An empty stderr proves src/warnings.ts still drops Node 22's SQLite warning in the built output.
          node_modules/.bin/melian --help > "$RUNNER_TEMP/help.out" 2> "$RUNNER_TEMP/help.err"
          grep -q '^Usage: melian ' "$RUNNER_TEMP/help.out"
          if [ -s "$RUNNER_TEMP/help.err" ]; then cat "$RUNNER_TEMP/help.err"; echo "melian --help wrote to stderr"; exit 1; fi
          git init -q
          mkdir "$RUNNER_TEMP/config" "$RUNNER_TEMP/pi"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/config" PI_CODING_AGENT_DIR="$RUNNER_TEMP/pi"
          node_modules/.bin/melian tools > "$RUNNER_TEMP/tools.out"
          grep -q '^enola@.*not yet fetched' "$RUNNER_TEMP/tools.out"
          node_modules/.bin/melian doctor > "$RUNNER_TEMP/doctor.out"
          grep -q 'tool enola.*not yet fetched' "$RUNNER_TEMP/doctor.out"
      - name: Fail if check rewrote files
        run: git diff --exit-code

  # Linux skips the tests that need sandbox-exec, a BSD ps or launchd. This job runs only the files that hold a test the
  # Node 24 Linux job skipped, and fails unless every such test passed here; Biome, tsc, the audit and every other test
  # ran on Linux already. A test that passes on Linux and fails only on macOS is not run here, which is why AGENTS.md
  # keeps the host rerun until this job is required.
  check-macos:
    name: check (macos, 24)
    needs: check
    if: ${{ !cancelled() }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - if: github.event_name != 'push'
        run: git fetch --no-tags origin +main:refs/remotes/origin/main
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-vitest-report
          path: ${{ runner.temp }}/linux
      # The seatbelt suite skips its ssh-agent test unless launchd holds an agent socket.
      - name: Start an ssh agent for launchd
        run: |
          eval "$(ssh-agent -s)"
          launchctl setenv SSH_AUTH_SOCK "$SSH_AUTH_SOCK"
      - name: List the files Linux skipped tests in
        run: |
          jq -e -r '
            [.testResults[] | .name as $name | select(any(.assertionResults[]; .status != "passed"))
              | $name | sub("^.*?/(?<p>(packages|scripts)/)"; "\(.p)")]
            + ["scripts/codex-sandboxed.test.mjs", "packages/pipeline/test/mutation-process-real.test.ts"]
            | unique | if length > 2 then .[] else error("the Linux report shows no skipped test") end
          ' "$RUNNER_TEMP/linux/vitest.json" > "$RUNNER_TEMP/files.txt"
          cat "$RUNNER_TEMP/files.txt"
      - name: Run those files
        run: xargs npx vitest --run --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/vitest.json" < "$RUNNER_TEMP/files.txt"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MELIAN_SANDBOX_NETWORK: "1"
      # Every test Linux skipped must pass here, except the allowlist, and each named suite must be present and pass
      # whole, so a new platform-gated test cannot skip unseen.
      - name: Fail if a test Linux skipped did not pass here
        run: |
          jq -e -r -n --slurpfile linux "$RUNNER_TEMP/linux/vitest.json" --slurpfile mac "$RUNNER_TEMP/vitest.json" '
            def tests: [.testResults[] | (.name | sub("^.*?/(?<p>(packages|scripts)/)"; "\(.p)")) as $file
              | .assertionResults[] | {id: ([$file] + .ancestorTitles + [.title] | join(" > ")), file: $file, status}];
            ($linux[0] | tests | map(select(.status != "passed")) | map(.id)) as $skipped
            | ($mac[0] | tests) as $tests
            | ($tests | map({key: .id, value: .status}) | from_entries) as $status
            | ["scripts/codex-sandboxed.test.mjs", "packages/pipeline/test/mutation-process-real.test.ts"] as $suites
            # Only root can give a file to another user, and neither runner is root.
            | ["packages/core/test/secrets.test.ts > loadSecrets > refuses a command in a file another user owns, advising chown"] as $allowed
            | [$suites[] as $suite | [$tests[] | select(.file == $suite)]
                | {suite: $suite, passed: (map(select(.status == "passed")) | length), total: length}] as $counts
            | [$skipped[] | select(IN($allowed[]) | not) | select($status[.] != "passed") | "\(.): \($status[.] // "missing")"] as $bad
            | [$tests[] | select(.status != "passed") | select(.id | IN($allowed[]) | not) | "\(.id): \(.status)"] as $failed
            | ($counts[] | "\(.suite): \(.passed) of \(.total) passed"),
              ($bad[] | "skipped on Linux, not passed here: \(.)"),
              ($failed[] | "did not pass here: \(.)"),
              (if ($counts | all(.total > 0 and .passed == .total)) and ($bad | length == 0) and ($failed | length == 0)
                then "\($skipped | length) tests Linux skipped: every one passed here or is allowlisted"
                else error("a test Linux skipped did not pass here, a test failed, or a named suite is missing") end)
          '
