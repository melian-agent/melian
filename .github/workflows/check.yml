name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # Node 22 bundles npm 10, which silently ignores min-release-age in .npmrc.
      - if: matrix.node == 22
        run: npm install -g npm@11.19.0
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Fail if check rewrote files
        run: git diff --exit-code
