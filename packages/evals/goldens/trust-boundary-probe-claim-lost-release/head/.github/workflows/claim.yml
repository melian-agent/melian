name: claim

# Cloud builders reach GitHub through an app that cannot edit labels, so this sets the claim labels for them under the
# rules in AGENTS.md's Work from issues. Every run, whatever comment started it, reads the whole timeline and makes the
# labels match the state it calls for, so a cancelled or failed run is repaired by the next. Comments are only ever
# data: the script reads them from the API, and nothing interpolates them into a shell or a script.
on:
  issue_comment:
    types: [created]

permissions:
  issues: write

concurrency:
  group: claim-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  swap-labels:
    if: ${{ !github.event.issue.pull_request }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const READY = "status: ready";
            const IN_PROGRESS = "status: in progress";
            const { owner, repo } = context.repo;
            const { issue } = context.payload;
            const issue_number = issue.number;
            if (issue.pull_request) return;

            const writers = new Map();
            const isWriter = async (login) => {
              if (!writers.has(login)) {
                try {
                  const { data } = await github.rest.repos.getCollaboratorPermissionLevel({ owner, repo, username: login });
                  writers.set(login, data.permission === "admin" || data.permission === "write");
                } catch (error) {
                  if (error.status !== 404) throw error;
                  writers.set(login, false);
                }
              }
              return writers.get(login);
            };

            // A ready label opens the issue to claims. The first writer's claim after it calls for in progress, and a
            // writer's release after that for ready again. A hand removal of the label the state calls for takes the
            // issue out of the workflow's hands until it is marked ready again.
            const timeline = await github.paginate(github.rest.issues.listEventsForTimeline, { owner, repo, issue_number, per_page: 100 });
            let want;
            for (const item of timeline) {
              if (item.event === "labeled" && item.label.name === READY) want = READY;
              else if (item.event === "unlabeled" && item.label.name === want) want = undefined;
              else if (item.event === "commented" && want !== undefined) {
                const command = want === READY ? "Claim:" : "Released:";
                if (item.body.startsWith(command) && (await isWriter(item.user.login))) want = want === READY ? IN_PROGRESS : READY;
              }
            }
            if (want === undefined) return core.info("The claim rules call for no status label here.");

            const unwanted = want === READY ? IN_PROGRESS : READY;
            const { data: current } = await github.rest.issues.get({ owner, repo, issue_number });
            const labels = current.labels.map((label) => label.name);
            if (!labels.includes(want)) await github.rest.issues.addLabels({ owner, repo, issue_number, labels: [want] });
            if (labels.includes(unwanted)) await github.rest.issues.removeLabel({ owner, repo, issue_number, name: unwanted });
            core.info(`The issue reads "${want}".`);
