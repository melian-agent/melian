# Melian's policy for its own repository. A pull request is reviewed under the base commit's copy of this file.
# Its routes are defaults: a maintainer without their credentials gets a route derived from the credentials they hold,
# which melian doctor prints and every check run on it records. Route your own tiers in melian.local.yaml or
# ~/.config/melian/config.yaml, or pass --model; keep keys in melian.secrets.yaml or ~/.config/melian/secrets.yaml.
trust: { writers: true }
comparison: { retirement: { pullRequests: 10, recall: 0.75 } }

models:
  # Triage takes the first of light, medium and heavy that routes a model, so light is triage's route. Every lens's
  # quick level runs on light too, through the extensions under .melian/lenses/, which leaves medium to the design
  # lens alone (decisions/2026-10-24-design-lens-on-codex-route.md).
  light:
    model: openai-codex/gpt-5.6-terra
    thinking: low
    fallbacks: [anthropic/claude-sonnet-5-5]
    accept: [openai-codex/gpt-5.6-terra, anthropic/claude-sonnet-5-5]
  heavy:
    model: openai-codex/gpt-6.1-sol
    thinking: low
    fallbacks: [anthropic/claude-opus-5-5, openai/gpt-5.5]
    accept: [openai-codex/gpt-6.1-sol, anthropic/claude-opus-5-5, openai/gpt-5.5]
  # The design lens alone: the model and effort Codex's adversarial review runs, so the two compare like for like.
  medium:
    model: openai-codex/gpt-5.6-sol
    thinking: high
    fallbacks: [anthropic/claude-opus-5-5]
    accept: [openai-codex/gpt-5.6-sol, anthropic/claude-opus-5-5]
  # Sonnet checks across families by default; Terra permits verification through a ChatGPT subscription.
  verifier:
    model: anthropic/claude-sonnet-5-5
    fallbacks: [anthropic/claude-opus-5-5]
    accept: [anthropic/claude-sonnet-5-5, anthropic/claude-opus-5-5, openai/gpt-5.5, openai-codex/gpt-5.6-terra]

tiers:
  fast: [guardrails, static.biome, static.tsc, static.enola]
  # The default full tier plus Melian's own repository lenses under .melian/lenses/. static.mutation is off this
  # repository's rounds from 2026-10-24 (decisions/2026-10-24-stryker-off-the-hot-path.md); opt in with
  # tiers: { full: [static.mutation] } in an uncommitted melian.local.yaml.
  full: [standard, lens.contracts, lens.trust-boundary, lens.removed-behaviour, lens.tests, lens.conventions, lens.durability, lens.design]

static:
  enola: { enabled: true }
  # A cold run measured 1.5 s per line (1,678 lines in 2,489 s). 1,250 lines is about 31 minutes, inside the 40-minute
  # aim with a fifth to spare, and 1,300 would not leave it. The decision records the arithmetic.
  mutation: { enabled: true, timeout: 7200, maxLines: 1250 }

# The golden corpus seeds defects on purpose, so no lens reviews a golden's trees as Melian's own code.
lenses:
  correctness: { paths: ["**", "!packages/evals/goldens/**", "!packages/evals/verifier/**", "!packages/evals/triage/**"] }
  contracts: { paths: ["**", "!packages/evals/goldens/**", "!packages/evals/verifier/**", "!packages/evals/triage/**"] }
  trust-boundary: { paths: ["**", "!packages/evals/goldens/**", "!packages/evals/verifier/**", "!packages/evals/triage/**"] }
  removed-behaviour: { paths: ["**", "!packages/evals/goldens/**", "!packages/evals/verifier/**", "!packages/evals/triage/**"] }
  tests: { paths: ["**", "!packages/evals/goldens/**", "!packages/evals/verifier/**", "!packages/evals/triage/**"] }
  conventions: { paths: ["**", "!packages/evals/goldens/**", "!packages/evals/verifier/**", "!packages/evals/triage/**"] }
  design: { paths: ["**", "!packages/evals/goldens/**", "!packages/evals/verifier/**", "!packages/evals/triage/**"] }

guardrails:
  # A merge_group run uses the group commit's workflow files, so an edit to one changes the gate judging its own group.
  policy-change-review:
    files: [".github/**"]

  forbidden-paths:
    rules:
      build-output:
        paths: ["**/dist/**", "**/*.tsbuildinfo"]
        message: npm run build writes this; change the source instead

  required-files:
    rules:
      config-key-table:
        when: [packages/core/src/config.ts]
        require: [docs/guidelines/core.md]
        message: a melian.yaml key goes into the schema, the defaults, and the key table in docs/guidelines/core.md together

  forbidden-patterns:
    rules:
      free-domain-function:
        pattern: '^(export )?(async )?function \w+\(\w+: (readonly )?(Finding|ResolvedFinding|Defect|Verdict|Manifest|Lens|Revision|Changeset|Comparison|ExternalFinding)\b'
        paths: ["packages/*/src/**"]
        message: behaviour belongs to the object it is about, so make this a method on that object's class or on this package's own class that adapts it; for a false positive, the Biome rule biome/free-domain-function.grit reads the syntax and the rule in AGENTS.md decides
      focused-test:
        pattern: '^\s*(?:describe|it|test)\.only\('
        paths: ["**/*.test.ts"]
        message: a focused test skips the rest of the suite
      stryker-disable:
        pattern: 'Stryker disable'
        paths: ["**/*.ts", "**/*.tsx", "**/*.mts", "**/*.cts", "!**/test/**", "!**/tests/**", "!**/*.test.*", "!**/*.spec.*", "!packages/evals/goldens/**", "!packages/evals/verifier/**"]
        message: a Stryker disable comment hides the mutants of the lines it covers from static.mutation, so a guard stays unproven; test the behaviour instead, or a maintainer decides the exception
      unpinned-action:
        pattern: 'uses:\s*[^\s#]+@v\d'
        paths: [".github/workflows/**"]
        message: a tag can be moved to other code after review, so pin the action to a full commit SHA with its version in a comment, as check.yml does
      hand-built-revision-key:
        pattern: '\$\{[^`]*\}\.\.\$\{'
        paths: ["packages/*/src/**"]
        message: every round key and its display come from core's Revision.key, Revision.parseKey and Revision.display, so a scope the key does not know is refused in one place; call those instead of joining a base and a head by hand
      dynamic-import:
        pattern: 'await import\(|import\(["'']'
        paths: ["packages/*/src/**"]
        message: AGENTS.md allows top-level imports only
      bare-issue-reference:
        pattern: '(^|[\s(])#\d+([^\w\]-]|$)'
        paths: ["**/*.md", "!.github/**", "!packages/evals/goldens/**", "!packages/evals/verifier/**", "!packages/evals/triage/**"]
        severity: P3
        message: 'AGENTS.md says to link every GitHub issue and pull request you mention, in chat and docs, because only GitHub''s own UI turns a bare number into a link; write the number as the text of a Markdown link to its page'
      overlong-sentence:
        pattern: '([\w''’`-]+[^\w''’`.!?|\n]+){44,}[\w''’`-]+'
        paths: ["docs/**/*.md", "packages/evals/comparisons/**/*.md", "README.md", "!packages/evals/goldens/**", "!packages/evals/verifier/**", "!packages/evals/triage/**"]
        severity: P3
        message: 'AGENTS.md says to prefer short sentences and, for one that runs past about 25 words, to find the seam; this line holds 45 or more words with no full stop, question mark, exclamation mark, or table bar'
